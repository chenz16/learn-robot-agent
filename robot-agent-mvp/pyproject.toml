[project]
name = "robot-agent-mvp"
version = "0.1.0"
description = "Robot Agent MVP: LLM task decomposition + VLA execution in LIBERO simulation"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "nanobot-ai",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
libero = [
    "robosuite",
    "libero",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.1.0",
]

[project.scripts]
robot-agent = "robot_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
